plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = '21'
    modules = [ 'javafx.controls' ]
}

application {
    mainClass = 'org.example.World'
}

tasks.register('runGwo', JavaExec) {
    group = 'application'
    description = 'Uruchamia World (JavaFX) z algorytmem GWO'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.World'
    systemProperty 'drone.planner', 'gwo'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
