plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = '21'
    modules = [ 'javafx.controls' ]
}

application {
    mainClass = 'org.example.World'
}

/** -D z linii Gradle trafia do JVM daemona, nie do aplikacji — przekaż tutaj. */
def trajectoryCsvProp = System.getProperty('drone.trajectory.csv')

tasks.named('run', JavaExec) {
    if (trajectoryCsvProp != null) {
        systemProperty 'drone.trajectory.csv', trajectoryCsvProp
    }
}

tasks.register('runGwo', JavaExec) {
    group = 'application'
    description = 'Uruchamia World (JavaFX) z algorytmem GWO'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.World'
    systemProperty 'drone.planner', 'gwo'
    if (trajectoryCsvProp != null) {
        systemProperty 'drone.trajectory.csv', trajectoryCsvProp
    }
}

tasks.register('runNsga2', JavaExec) {
    group = 'application'
    description = 'Uruchamia World (JavaFX) z NSGA-II'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.World'
    systemProperty 'drone.planner', 'nsga2'
    if (trajectoryCsvProp != null) {
        systemProperty 'drone.trajectory.csv', trajectoryCsvProp
    }
}

tasks.register('runNsga3', JavaExec) {
    group = 'application'
    description = 'Uruchamia World (JavaFX) z NSGA-III'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.World'
    systemProperty 'drone.planner', 'nsga3'
    if (trajectoryCsvProp != null) {
        systemProperty 'drone.trajectory.csv', trajectoryCsvProp
    }
}

tasks.register('runNsga2Bench', JavaExec) {
    group = 'application'
    description = 'Tabela metryk NSGA-II vs iteracje (CSV z sep=;) — opcjonalnie: -PbenchArgs="500 42" (populacja, ziarno)'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.bench.Nsga2MetricsBench'
    def ba = project.findProperty('benchArgs')
    if (ba != null) {
        args(ba.toString().trim().split(/\s+/).findAll { it.length() > 0 })
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
