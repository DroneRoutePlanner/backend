plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.0.14'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

javafx {
    version = '21'
    modules = [ 'javafx.controls' ]
}

application {
    // Launcher, nie World — patrz Javadoc org.example.Launcher (JavaFX z classpath).
    mainClass = 'org.example.Launcher'
}

/*
 * -D z linii Gradle trafia do JVM daemona, nie do aplikacji — właściwości przekazywane jawnie:
 *   drone.trajectory.csv  ścieżka zapisu trajektorii (obok powstaje *_terrain.csv)
 *   drone.seed            ziarno terenu i algorytmu (odtwarzalność)
 */
def forwardedProperties = ['drone.trajectory.csv', 'drone.seed']

def forwardProperties = { JavaExec task ->
    forwardedProperties.each { name ->
        def value = System.getProperty(name)
        if (value != null) {
            task.systemProperty name, value
        }
    }
}

tasks.named('run', JavaExec) { forwardProperties(it) }

['gwo', 'nsga2', 'nsga3'].each { planner ->
    tasks.register("run${planner.capitalize()}", JavaExec) {
        group = 'application'
        description = "Uruchamia World (JavaFX) z algorytmem ${planner}"
        classpath = sourceSets.main.runtimeClasspath
        mainClass = 'org.example.Launcher'
        systemProperty 'drone.planner', planner
        forwardProperties(it)
    }
}

tasks.register('runCompare', JavaExec) {
    group = 'application'
    description = 'Porównanie NSGA-II / NSGA-III / MOGWO hiperobjętością (bez UI). ' +
            'Opcje: -PcompareArgs="pop=100 iter=100 runs=3 seed=42 out=csv/comparison"'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.example.bench.AlgorithmComparison'
    def compareArgs = project.findProperty('compareArgs')
    if (compareArgs != null) {
        args(compareArgs.toString().trim().split(/\s+/).findAll { it.length() > 0 })
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.9.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}
